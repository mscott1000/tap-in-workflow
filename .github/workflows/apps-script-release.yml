name: Apps Script release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan is offline; inspect reads live code; apply publishes only an enabled and reconciled target'
        type: choice
        options: [plan, inspect, apply]
        default: plan
        required: true
      target:
        description: 'Approved project target'
        type: choice
        options: [appsheet-intake]
        default: appsheet-intake
        required: true
      approved_bundle_sha256:
        description: 'For apply only: exact bundle fingerprint from an inspected and approved change'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: tap-in-release-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  offline-plan:
    if: inputs.mode == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check
      - name: Offline release plan
        env:
          TARGET: ${{ inputs.target }}
        run: node scripts/apps-script-release.mjs --mode plan --target "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-plan
          path: release-report.json
          retention-days: 7
  live-operation:
    if: inputs.mode != 'plan' && github.ref == 'refs/heads/main'
    environment: tap-in-publishing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check
      - name: Inspect or publish approved bundle
        env:
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          APPROVED_BUNDLE: ${{ inputs.approved_bundle_sha256 }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          if [ "$MODE" = "apply" ]; then
            node scripts/apps-script-release.mjs --mode "$MODE" --target "$TARGET" --approved-bundle-sha256 "$APPROVED_BUNDLE"
          else
            node scripts/apps-script-release.mjs --mode "$MODE" --target "$TARGET"
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-report
          path: release-report.json
          retention-days: 7
